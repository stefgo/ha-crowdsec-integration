name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # HACS shows the tag, the integration reports the manifest version — if
      # the two drift apart, an update looks installed but is not. The card
      # carries its own version and is bumped in the same step, so it is
      # checked here too rather than being noticed months later.
      - name: Check versions against tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          read_version() { python -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "$1"; }
          for file in custom_components/crowdsec/manifest.json card/package.json; do
            version=$(read_version "$file")
            if [ "$tag" != "$version" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version $version in $file" >&2
              exit 1
            fi
          done

      # The release notes come from CHANGELOG.md, so what the release page
      # says and what the repository says cannot drift apart. No section for
      # the tag means no release — writing the entry is part of releasing.
      - name: Extract release notes from CHANGELOG.md
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Stop at the next version heading, or at the block of link
          # definitions that closes the file — those belong to no section.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |^\[[^\]]+\]: |\Z)",
              text,
              re.MULTILINE | re.DOTALL,
          )
          if match is None:
              sys.exit(f"CHANGELOG.md has no section '## [{version}]'")
          notes = match.group(1).strip()
          if not notes:
              sys.exit(f"The section '## [{version}]' in CHANGELOG.md is empty")
          pathlib.Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print(notes)
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json

      # The built card is not committed; it is created here and travels in the
      # zip, because that is the only copy a HACS install ever sees.
      - run: npm --prefix card ci
      - run: npm --prefix card test
      # CROWDSEC_MINIFY is release-only: the bundle that ships in the zip is
      # minified, local builds stay readable. No CROWDSEC_BUILD_COUNTER here,
      # so the released card reports the bare semver.
      - run: npm --prefix card run build
        env:
          CROWDSEC_MINIFY: "1"

      # HACS extracts the zip straight into custom_components/crowdsec, so
      # manifest.json has to sit at the root of the archive.
      - name: Build crowdsec.zip
        run: |
          cd custom_components/crowdsec
          zip -r "$GITHUB_WORKSPACE/crowdsec.zip" . -x '*__pycache__*' '*.pyc'

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" crowdsec.zip \
            --title "CrowdSec ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
