name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly: hassfest and HACS change their rules without anything being
    # committed here — yesterday's green run says little otherwise.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration

  lint:
    name: ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      # Only the Home-Assistant-free modules; see pyproject.toml.
      - run: mypy

  tests:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test.txt
      - run: pytest -q

  tests-ha:
    name: pytest (with Home Assistant)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements_test_ha.txt
      # Its own invocation: these tests need the real Home Assistant fixtures,
      # whereas pytest.ini is set up for the framework-free suite.
      - run: pytest -p no:cacheprovider -c pytest_ha.ini

  card:
    name: card
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: card/package-lock.json
      - run: npm --prefix card ci
      - run: npm --prefix card run lint
      # The elements themselves have no unit tests — the card setup has no DOM
      # environment — so without this a type error in them reaches CI only if
      # it happens to break the bundler as well.
      - run: npm --prefix card run typecheck
      - run: npm --prefix card test
      # The build is not committed, so a broken rollup config would otherwise
      # only surface during a release.
      - run: npm --prefix card run build
